<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Мишка</title>
<style>body{font:18px system-ui;background:#e1eaec;color:#183e47;margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(340px,85vw)}h1{font-size:32px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:12px 0;border:1px solid #77939b;border-radius:10px;font:inherit}button{background:#087f92;color:white;cursor:pointer}p{line-height:1.5}#error{color:#8b2020}</style>
<main><h1>Мишка</h1><p>Введите пароль доступа к удалённому телефону.</p><form method="post" id="login"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required><button>Войти</button></form><p id="error" role="alert"></p></main>
<script>document.getElementById('login').addEventListener('submit',async event=>{event.preventDefault();const input=document.getElementById('password'),button=event.target.querySelector('button'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const response=await fetch('/ready',{headers:{Authorization:'Basic '+btoa('mishka:'+input.value)},credentials:'same-origin',cache:'no-store'});if(response.status!==200&&response.status!==503)throw new Error('Вход не выполнен. Проверьте пароль.');input.value='';location.replace('/console');}catch(e){error.textContent='Вход не выполнен. Проверьте пароль и соединение.';}finally{button.disabled=false;}});</script></html>
